[signup_trend]
sql = "SELECT signup_year, count(*) AS customers FROM customers GROUP BY ALL"
intent = "how has the number of new customers changed over the years"
accept = ["line:signup_year+customers"]

[price_by_rating]
sql = "SELECT rating, avg(price) AS avg_price FROM products GROUP BY ALL"
intent = "how does the average price differ between rating levels"
accept = ["bar:rating+avg_price"]

[category_revenue_compare]
sql = "SELECT category, sum(revenue) AS revenue, sum(profit) AS profit FROM orders JOIN products USING (product_id) GROUP BY ALL"
intent = "how does revenue compare across categories"
accept = ["bar:category+revenue"]

[channel_growth]
sql = "SELECT date_trunc('month', order_date) AS order_month, channel, sum(revenue) AS revenue FROM orders GROUP BY ALL"
intent = "is the web channel growing faster than stores"
accept = ["multi_line:channel+revenue"]

[channel_biggest]
sql = "SELECT date_trunc('month', order_date) AS order_month, channel, sum(revenue) AS revenue FROM orders GROUP BY ALL"
intent = "which channel is biggest overall"
