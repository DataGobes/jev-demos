[segment_country_mix]
sql = "SELECT country, segment, count(*) AS customers FROM customers GROUP BY ALL"
intent = "how do customer segments break down within each country"
accept = ["stacked_bar:country+segment+customers", "grouped_bar:country+segment+customers"]

[order_size_profit]
sql = "SELECT revenue, profit FROM orders LIMIT 3000"
intent = "do bigger orders make more profit"
accept = ["scatter:revenue+profit"]
