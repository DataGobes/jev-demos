[project]
name = "desc-judge"
version = "0.1.0"
description = "Check-shaped CLI: judge dbt column descriptions against their columns, from the dbt v2 information schema"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.5.4"]

[project.scripts]
desc-judge = "desc_judge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "jinja2>=3", "ruff>=0.6", "adbc-driver-manager>=1.12", "pyarrow>=17", "duckdb-extension-httpfs==1.5.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desc_judge"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
