# Column descriptions for the judge to evaluate. Most are accurate. The ones marked WRONG are
# deliberately mismatched; SUBTLE is wrong in a way a keyword judge cannot see (an LLM should);
# fct_revenue.order_count has no description at all.
version: 2

models:
  - name: stg_customers
    description: One row per customer.
    columns:
      - name: customer_id
        data_type: integer
        description: Unique id of the customer
      - name: first_name
        data_type: varchar
        description: Customer first name
      - name: last_name
        data_type: varchar
        description: Customer phone number            # WRONG
      - name: email
        data_type: varchar
        description: The customer's email
      - name: signup_date
        data_type: date
        description: Customer signup date

  - name: stg_orders
    description: One row per order.
    columns:
      - name: order_id
        data_type: integer
        description: Unique id of the order
      - name: customer_id
        data_type: integer
        description: Foreign key to the customer
      - name: order_date
        data_type: date
        description: Order placement date
      - name: status
        data_type: varchar
        description: Order status
      - name: order_total
        data_type: decimal(10,2)
        description: Customer email                   # WRONG

  - name: customer_orders
    description: One row per customer with order totals.
    columns:
      - name: customer_id
        data_type: integer
        description: Unique id of the customer
      - name: first_order_date
        data_type: date
        description: Date of the customer's most recent order   # SUBTLE (it is min(), the first order)
      - name: order_count
        data_type: bigint
        description: Average basket size in euros     # WRONG
      - name: lifetime_value
        data_type: decimal(38,2)
        description: Customer lifetime value

  - name: fct_revenue
    description: Daily revenue from non-returned orders.
    columns:
      - name: revenue_date
        data_type: date
        description: Date the shipment was delivered   # WRONG
      - name: daily_revenue
        data_type: decimal(38,2)
        description: Daily revenue
      - name: order_count
        data_type: bigint
