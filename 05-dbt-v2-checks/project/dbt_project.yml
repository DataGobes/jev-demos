name: desc_checks
version: "1.0.0"
profile: desc_checks

model-paths: ["models"]
macro-paths: ["macros"]
check-paths: ["checks"]

# Required once a package has checks (dbt-parser/src/resolve/resolve_checks.rs:130-148).
info_schema:
  version: 1

models:
  desc_checks:
    +materialized: view

# Probe checks (checks/probes/) exist to record what a check can do. Off unless
# DESC_CHECKS_PROBES=true; severity warn so they show their rows without failing the run.
checks:
  desc_checks:
    probes:
      +enabled: "{{ env_var('DESC_CHECKS_PROBES', 'false') }}"
      +severity: warn
      +tags: [probe]
